# Публікує Helm-чарти як GitHub Releases і оновлює index.yaml у гілці gh-pages
# (Helm-репозиторій https://silentprog.github.io/mini-task-manager-charts).
# Реліз створюється лише тоді, коли у Chart.yaml змінилась version.
name: Release Charts

on:
  push:
    branches: [main]
    paths: ["charts/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint charts
        run: helm lint charts/*

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
